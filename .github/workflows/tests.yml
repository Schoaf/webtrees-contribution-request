# Tests against a real webtrees (tests/test_module.py) on every push and pull request.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  module:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, gd, iconv, intl, json, mbstring, pdo, pdo_sqlite, session, xml, zip, zlib
          ini-values: memory_limit=512M
      - name: Tests
        run: python3 -W ignore tests/test_module.py
      - name: PHP log on failure
        if: failure()
        run: tail -100 tests/.work/php.log || true
